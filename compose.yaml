services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: smartbox
      POSTGRES_PASSWORD: smartbox
      POSTGRES_DB: smartbox
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["smartbox_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbox"]
      interval: 3s
      retries: 10
volumes:
  smartbox_db:
