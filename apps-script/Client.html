<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const state = { boxes: [], selected: '', query: '', ready: false, loading: false, appUrl: '', editing: null, deleting: null, photo: null, photoBusy: false, photoError: false, busy: false };
  const isGoogle = Boolean(window.google?.script?.run);
  const api = (name, ...args) => {
    if (window.smartBoxesDemo) return window.smartBoxesDemo(name, ...args);
    if (!isGoogle) return Promise.reject(new Error('Відкрийте опублікований інтерфейс Apps Script або запустіть локальний демо-перегляд.'));
    return new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));
  };
  const message = error => error?.message || 'Щось пішло не так. Спробуйте ще раз.';
  function notice(id, text = '') { $(id).textContent = text; $(id).hidden = !text; }
  let toastTimer;
  function toast(text) { notice('toast', text); clearTimeout(toastTimer); toastTimer = setTimeout(() => notice('toast'), 4500); }
  function el(tag, className, text) { const node = document.createElement(tag); if (className) node.className = className; if (text != null) node.textContent = text; return node; }
  function busy(dialogId, value) {
    state.busy = value;
    $(dialogId).querySelectorAll('button, input, select, textarea').forEach(node => { node.disabled = value; });
    if (dialogId === 'item-dialog' && !value) $('item-box').disabled = Boolean(state.editing);
  }
  function selectBox(id, push = true) {
    state.selected = state.boxes.some(box => box.id === id) ? id : '';
    state.query = ''; $('search').value = '';
    if (push) {
      if (isGoogle) google.script.history.push({}, state.selected ? { box: state.selected } : {}, '');
      else { const url = new URL(location.href); url.search = ''; if (state.selected) url.searchParams.set('box', state.selected); history.pushState({}, '', url); }
    }
    render();
  }
  async function load() {
    if (state.loading) return false;
    state.loading = true; $('refresh').disabled = true; $('new-box').disabled = true; $('add-item').disabled = true;
    notice('page-error');
    try {
      const data = await api('getInventory');
      state.boxes = data.boxes; state.appUrl = data.appUrl; state.ready = true;
      if (state.selected && !state.boxes.some(box => box.id === state.selected)) {
        state.selected = ''; toast('Коробку за цим посиланням не знайдено.');
      }
      notice('page-note', data.skipped.length ? 'Пропущені вкладки з іншою структурою: ' + data.skipped.join(', ') + '. Очікуються заголовки №, Title, Photo, Description у другому рядку.' : '');
      render(); return true;
    } catch (error) { notice('page-error', message(error)); return false; }
    finally {
      state.loading = false; $('loading').hidden = true; $('refresh').disabled = false;
      $('new-box').disabled = !state.ready; $('add-item').disabled = !state.boxes.length;
    }
  }
  async function reloadAfterSave(text) {
    toast(text);
    if (!(await load())) notice('page-error', 'Зміни збережено, але список не вдалося оновити. Натисніть «Оновити».');
  }
  function render() {
    const selected = state.boxes.find(box => box.id === state.selected);
    const all = state.boxes.flatMap(box => box.items.map(item => ({ ...item, boxId: box.id, boxName: box.name })));
    $('box-count').textContent = state.boxes.length;
    $('box-list').replaceChildren();
    [{ id: '', name: 'Усі речі', items: all }, ...state.boxes].forEach(box => {
      const button = el('button', 'box-nav' + (box.id === state.selected ? ' active' : ''));
      button.setAttribute('aria-current', box.id === state.selected ? 'page' : 'false');
      button.append(el('span', '', box.id ? '▧' : '⊞'), el('span', 'box-nav-title', box.name), el('span', 'box-nav-count', box.items.length));
      button.onclick = () => selectBox(box.id); $('box-list').append(button);
    });
    const query = state.query.toLocaleLowerCase('uk').trim();
    const inBox = all.filter(item => !selected || item.boxId === selected.id);
    const items = inBox.filter(item => [item.title, item.description, String(item.number), item.boxName].some(value => value.toLocaleLowerCase('uk').includes(query)));
    $('catalog-title').textContent = selected ? selected.name : 'Усі речі';
    $('catalog-caption').textContent = selected ? 'УСЕРЕДИНІ КОРОБКИ' : 'ОГЛЯД КОЛЕКЦІЇ';
    $('item-count').textContent = query ? 'Знайдено: ' + items.length + ' із ' + inBox.length : 'Речей: ' + inBox.length + (selected ? '' : ' · Коробок: ' + state.boxes.length);
    $('share-box').hidden = !selected;
    $('items').replaceChildren(...items.map(card));
    $('empty').hidden = items.length > 0 || !state.ready;
    $('empty-title').textContent = query ? 'Нічого не знайшлося' : state.boxes.length ? 'Тут поки порожньо' : 'Почнімо з першої коробки';
    $('empty-copy').textContent = query ? 'Спробуйте іншу назву або виберіть «Усі речі».' : state.boxes.length ? 'Натисніть «Додати річ», щоб наповнити коробку.' : 'Натисніть «Нова коробка» та дайте їй назву.';
  }
  function card(item) {
    const article = el('article', 'item-card');
    const photo = el('div', 'item-photo');
    const fallback = el('span', 'image-fallback', item.hasPhoto ? 'Не вдалося показати фото' : 'Фото ще немає');
    photo.append(fallback);
    if (item.photoUrl) {
      const img = el('img'); img.alt = item.title; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
      let retried = false;
      img.onload = () => { fallback.hidden = true; };
      img.onerror = async () => {
        img.hidden = true; fallback.hidden = false;
        if (retried) return;
        retried = true;
        try { const url = await api('getItemPhoto', item.boxId, item.id); if (url) { img.src = url; img.hidden = false; } } catch (_) { /* Keep the readable fallback. */ }
      };
      img.src = item.photoUrl; photo.append(img);
    }
    photo.append(el('span', 'number-badge', '№ ' + item.number));
    const content = el('div', 'item-content');
    content.append(el('div', 'box-tag', item.boxName), el('h3', '', item.title));
    if (item.description) content.append(el('p', 'item-description', item.description));
    const actions = el('div', 'card-actions');
    const edit = el('button', 'card-action', 'Редагувати'); edit.setAttribute('aria-label', 'Редагувати: ' + item.title); edit.onclick = () => openItem(item);
    const remove = el('button', 'card-action delete-action', 'Видалити'); remove.setAttribute('aria-label', 'Видалити: ' + item.title);
    remove.onclick = () => { state.deleting = item; $('delete-copy').textContent = '«' + item.title + '» · № ' + item.number + ' · ' + item.boxName; notice('delete-error'); $('delete-dialog').showModal(); };
    actions.append(edit, remove); content.append(actions); article.append(photo, content); return article;
  }
  function preview(url) { $('preview-image').hidden = !url; $('photo-placeholder').hidden = Boolean(url); if (url) $('preview-image').src = url; else $('preview-image').removeAttribute('src'); }
  function openItem(item = null) {
    state.editing = item; state.photo = null; state.photoError = false; state.photoBusy = false;
    $('item-form').reset(); notice('item-error');
    $('item-dialog-title').textContent = item ? 'Редагувати річ' : 'Додати річ';
    $('item-box').replaceChildren(...state.boxes.map(box => { const option = el('option', '', box.name); option.value = box.id; return option; }));
    $('item-box').value = item?.boxId || state.selected || state.boxes[0]?.id || '';
    $('item-box').disabled = Boolean(item);
    $('item-title').value = item?.title || ''; $('item-description').value = item?.description || '';
    $('number-note').textContent = item ? 'Номер речі: ' + item.number : 'Номер буде присвоєно автоматично.';
    $('photo-status').textContent = 'Фото автоматично зменшиться перед завантаженням.';
    $('item-form').dataset.requestId = crypto.randomUUID();
    preview(item?.photoUrl || ''); $('item-dialog').showModal();
  }
  let photoGeneration = 0;
  async function choosePhoto(event) {
    const file = event.target.files[0]; if (!file) return;
    const generation = ++photoGeneration;
    state.photoBusy = true; state.photoError = false; state.photo = null; notice('item-error');
    $('save-item').disabled = true; $('photo-status').textContent = 'Готуємо фотографію…';
    try {
      const url = await compress(file);
      if (generation !== photoGeneration) return;
      state.photo = { mimeType: 'image/jpeg', base64: url.split(',')[1] }; preview(url);
      $('photo-status').textContent = 'Готово до завантаження · ' + Math.ceil(state.photo.base64.length * .75 / 1024) + ' КБ';
    } catch (error) { if (generation === photoGeneration) { state.photoError = true; notice('item-error', message(error)); $('photo-status').textContent = 'Виберіть інше фото.'; } }
    finally { if (generation === photoGeneration) { state.photoBusy = false; $('save-item').disabled = false; } }
  }
  async function compress(file) {
    if (file.size > 25 * 1024 * 1024) throw new Error('Фото завелике. Виберіть файл до 25 МБ.');
    if (file.type && !file.type.startsWith('image/')) throw new Error('Виберіть файл зображення.');
    const objectUrl = URL.createObjectURL(file);
    try {
      const img = new Image(); img.src = objectUrl;
      try { await img.decode(); } catch (_) { throw new Error('Цей формат фото не підтримує браузер. Виберіть JPEG/PNG або зробіть знімок камерою.'); }
      const scale = Math.min(1, 1200 / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement('canvas'); canvas.width = Math.max(1, Math.round(img.naturalWidth * scale)); canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
      const context = canvas.getContext('2d'); context.fillStyle = '#fff'; context.fillRect(0, 0, canvas.width, canvas.height); context.drawImage(img, 0, 0, canvas.width, canvas.height);
      let result;
      for (const quality of [.85, .7, .55]) { result = canvas.toDataURL('image/jpeg', quality); if (result.length * .75 < 1500000) return result; }
      throw new Error('Не вдалося зменшити фото. Виберіть інше зображення.');
    } finally { URL.revokeObjectURL(objectUrl); }
  }

  $('item-form').onsubmit = async event => {
    event.preventDefault(); if (state.busy || state.photoBusy) return;
    if (state.photoError) { notice('item-error', 'Спершу виберіть фотографію, яку вдалося прочитати.'); return; }
    if (!state.photo && !state.editing?.hasPhoto) { notice('item-error', 'Додайте фотографію речі.'); return; }
    busy('item-dialog', true); notice('item-error'); $('save-item').textContent = 'Зберігаємо…';
    let saved = false;
    try {
      await api('saveItem', { boxId: $('item-box').value, id: state.editing?.id || '', revision: state.editing?.revision || '', requestId: $('item-form').dataset.requestId, title: $('item-title').value, description: $('item-description').value, photo: state.photo });
      saved = true; $('item-dialog').close();
    } catch (error) { notice('item-error', message(error)); }
    finally { busy('item-dialog', false); $('save-item').textContent = 'Зберегти річ'; }
    if (saved) await reloadAfterSave('Річ збережено. Усе на своєму місці!');
  };
  $('new-box').onclick = () => { $('box-form').reset(); notice('box-error'); $('box-dialog').showModal(); };
  $('box-form').onsubmit = async event => {
    event.preventDefault(); if (state.busy) return;
    busy('box-dialog', true); notice('box-error'); $('save-box').textContent = 'Створюємо…'; let created;
    try { created = await api('createBox', $('box-name').value); $('box-dialog').close(); }
    catch (error) { notice('box-error', message(error)); }
    finally { busy('box-dialog', false); $('save-box').textContent = 'Створити коробку'; }
    if (created) { await reloadAfterSave('Нову коробку створено'); selectBox(created.id); }
  };
  $('delete-form').onsubmit = async event => {
    event.preventDefault(); if (state.busy) return;
    busy('delete-dialog', true); notice('delete-error'); $('confirm-delete').textContent = 'Видаляємо…'; let deleted = false;
    try { const item = state.deleting; await api('deleteItem', item.boxId, item.id, item.revision); deleted = true; $('delete-dialog').close(); }
    catch (error) { notice('delete-error', message(error)); }
    finally { busy('delete-dialog', false); $('confirm-delete').textContent = 'Видалити'; }
    if (deleted) await reloadAfterSave('Річ видалено');
  };
  $('share-box').onclick = () => {
    const url = new URL(state.appUrl || location.href); url.search = ''; url.hash = ''; url.searchParams.set('box', state.selected);
    $('share-url').value = url.href; $('copy-status').textContent = ''; $('share-dialog').showModal();
  };
  $('copy-link').onclick = async () => {
    try { await navigator.clipboard.writeText($('share-url').value); $('copy-status').textContent = 'Посилання скопійовано.'; }
    catch (_) { $('share-url').focus(); $('share-url').select(); $('copy-status').textContent = 'Скопіюйте виділене посилання вручну.'; }
  };
  document.querySelectorAll('[data-close]').forEach(button => button.onclick = () => { if (!state.busy) button.closest('dialog').close(); });
  document.querySelectorAll('dialog').forEach(dialog => dialog.addEventListener('cancel', event => { if (state.busy) event.preventDefault(); }));
  $('item-dialog').addEventListener('close', () => { photoGeneration++; state.photoBusy = false; $('save-item').disabled = false; });
  $('photo-file').onchange = choosePhoto; $('photo-camera').onchange = choosePhoto;
  $('add-item').onclick = () => openItem(); $('refresh').onclick = load; $('home').onclick = () => selectBox('');
  $('search').oninput = event => { state.query = event.target.value; render(); };
  if (window.smartBoxesDemo) $('demo-banner').hidden = false;
  if (isGoogle) {
    google.script.history.setChangeHandler(event => selectBox(event.location.parameter.box || '', false));
    google.script.url.getLocation(location => { state.selected = location.parameter.box || ''; load(); });
  } else {
    state.selected = new URL(location.href).searchParams.get('box') || '';
    window.addEventListener('popstate', () => selectBox(new URL(location.href).searchParams.get('box') || '', false));
    load();
  }
})();
</script>
